name: 构建
run-name: 构建 ${{ github.ref_name }}

on:
  workflow_call:
    inputs:
      release_mode:
        required: false
        type: boolean
        default: false
      build_android:
        required: false
        type: boolean
        default: true
      build_windows:
        required: false
        type: boolean
        default: true
      build_macos:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
      build_linux_x64:
        required: false
        type: boolean
        default: true
      build_linux_arm64:
        required: false
        type: boolean
        default: true
    secrets:
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEY_PROPERTIES:
        required: false
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: true
        type: boolean
        default: true
      build_windows:
        description: '构建 Windows'
        required: true
        type: boolean
        default: true
      build_macos:
        description: '构建 macOS'
        required: true
        type: boolean
        default: false
      build_ios:
        description: '构建 iOS'
        required: true
        type: boolean
        default: false
      build_linux_x64:
        description: '构建 Linux x64'
        required: true
        type: boolean
        default: false
      build_linux_arm64:
        description: '构建 Linux ARM64'
        required: true
        type: boolean
        default: false

concurrency:
  group: build-${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ !inputs.release_mode }}

permissions:
  contents: read

jobs:
  Build_Android:
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.release_mode && 360 || 45 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 配置 sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: 准备 Android 签名
        env:
          STORE_FILE: ${{ secrets.ANDROID_KEYSTORE }}
          PROPERTY_FILE: ${{ secrets.ANDROID_KEY_PROPERTIES }}
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          set -euo pipefail
          umask 077
          if [[ -n "$STORE_FILE" && -n "$PROPERTY_FILE" ]]; then
            printf '%s' "$STORE_FILE" | base64 --decode > android/keystore.jks
            printf '%s\n' "$PROPERTY_FILE" > android/key.properties
          elif [[ "$RELEASE_MODE" == "true" ]]; then
            echo "ANDROID_KEYSTORE 或 ANDROID_KEY_PROPERTIES Secret 未配置。" >&2
            exit 1
          else
            keytool -genkeypair -noprompt \
              -keystore android/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -dname 'CN=Android Debug,O=Android,C=US' \
              -keyalg RSA -keysize 2048 -validity 10000
            printf '%s\n' \
              'storePassword=android' \
              'keyPassword=android' \
              'keyAlias=androiddebugkey' \
              'storeFile=../debug.keystore' \
              > android/key.properties
          fi
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'oracle'
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target armv7-linux-androideabi \
            --target x86_64-linux-android
      - name: 配置 Gradle 插件仓库
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/plugin-repositories.gradle <<'EOF'
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - run: flutter pub get --enforce-lockfile
      - name: 配置 rhttp 签名预编译库
        run: dart tool/prepare_rhttp_prebuilt.dart
      - name: 下载 OpenList Android 内核
        run: python3 .github/scripts/fetch_openlist_core.py android
      - run: flutter build apk --release
      - name: 校验依赖锁文件未变更
        run: git diff --exit-code -- pubspec.lock
      - name: 清理 Android 签名文件
        if: always()
        run: |
          rm -f android/keystore.jks
          rm -f android/key.properties
          rm -f android/debug.keystore
      - name: sccache 统计
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: 上传 Android Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: apks
          path: build/app/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: ${{ !inputs.release_mode && 7 || 0 }}

  Upload_Android:
    runs-on: ubuntu-22.04
    needs: Build_Android
    if: inputs.release_mode && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载 Android 构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: apks
          path: outputs
      - name: 上传 APK 到 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(outputs/*.apk)
          (( ${#files[@]} > 0 )) || { echo "没有找到 Android APK。" >&2; exit 1; }
          existing=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Release 已存在 $name，为避免覆盖已发布二进制，本次跳过。"
            else
              gh release upload "${GITHUB_REF_NAME}" "$file"
            fi
          done

  Build_Windows:
    if: ${{ inputs.build_windows }}
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.release_mode && 360 || 45 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Inno Setup
        run: choco install innosetup --version=6.7.1 --no-progress -y
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 配置 sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: 获取 Flutter 依赖
        run: flutter pub get --enforce-lockfile
      - name: 配置 rhttp 签名预编译库
        run: dart tool/prepare_rhttp_prebuilt.dart
      - name: 下载 OpenList Windows 内核
        shell: pwsh
        run: python .github/scripts/fetch_openlist_core.py windows-x64
      - name: 构建 Windows 安装包
        run: python windows/build.py
      - name: 校验 Windows 构建产物
        shell: pwsh
        run: |
          $zip = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraPlus-*-windows-portable.zip')
          $installer = @(Get-ChildItem -Path build/windows -File -Filter 'VeneraPlus-*-windows-installer.exe')
          $coreDll = Join-Path (Get-Location) 'build\windows\x64\runner\Release\venera_openlist.dll'
          if ($zip.Count -ne 1) { throw "应当恰好生成一个 Windows zip，实际为 $($zip.Count)。" }
          if ($installer.Count -ne 1) { throw "应当恰好生成一个 Windows 安装包，实际为 $($installer.Count)。" }
          if (-not (Test-Path $coreDll) -or (Get-Item $coreDll).Length -le 0) { throw "Windows bundle 缺少 OpenList 内核：$coreDll" }
          $artifacts = @($zip + $installer)
          $empty = @($artifacts | Where-Object { $_.Length -le 0 })
          if ($empty.Count -gt 0) {
            throw "Windows 构建产物包含空文件：$($empty.Name -join ', ')"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $expectedRoot = [System.IO.Path]::GetFileNameWithoutExtension($zip[0].Name)
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip[0].FullName)
          try {
            $badEntries = @($archive.Entries | Where-Object {
              -not $_.FullName.StartsWith("$expectedRoot/") -and $_.FullName -ne "$expectedRoot/"
            })
            if ($badEntries.Count -gt 0) {
              throw "Windows zip 包含 $expectedRoot/ 之外的文件：$($badEntries.FullName -join ', ')"
            }
            $exeEntry = @($archive.Entries | Where-Object { $_.FullName -eq "$expectedRoot/VeneraPlus.exe" })
            if ($exeEntry.Count -ne 1) {
              throw "Windows zip 未包含 $expectedRoot/VeneraPlus.exe"
            }
            $coreEntry = @($archive.Entries | Where-Object { $_.FullName -eq "$expectedRoot/venera_openlist.dll" })
            if ($coreEntry.Count -ne 1 -or $coreEntry[0].Length -le 0) {
              throw "Windows zip 未包含 OpenList 内核"
            }
          } finally {
            $archive.Dispose()
          }
          $artifacts | Sort-Object Name | ForEach-Object { "$($_.Name) $($_.Length) bytes" }
      - name: sccache 统计
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: 上传 Windows Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows_build
          path: |
            build/windows/VeneraPlus-*-windows-portable.zip
            build/windows/VeneraPlus-*-windows-installer.exe
          if-no-files-found: error
          retention-days: ${{ !inputs.release_mode && 7 || 0 }}

  Upload_Windows:
    runs-on: ubuntu-22.04
    needs: Build_Windows
    if: inputs.release_mode && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载 Windows 构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows_build
          path: outputs
      - name: 上传 Windows 构建产物到 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(outputs/VeneraPlus-*-windows-portable.zip)
          installers=(outputs/VeneraPlus-*-windows-installer.exe)
          (( ${#zips[@]} == 1 )) || { echo "Windows zip 数量异常：${#zips[@]}" >&2; exit 1; }
          (( ${#installers[@]} == 1 )) || { echo "Windows installer 数量异常：${#installers[@]}" >&2; exit 1; }
          files=("${zips[@]}" "${installers[@]}")
          existing=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Release 已存在 $name，为避免覆盖已发布二进制，本次跳过。"
            else
              gh release upload "${GITHUB_REF_NAME}" "$file"
            fi
          done

  Build_MacOS:
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: arm64
          cache: true
      - name: 配置 sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin
      - name: 串行化 Rustup 安装操作
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-plus-rustup.lock" >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - name: 配置 rhttp 签名预编译库
        run: dart tool/prepare_rhttp_prebuilt.dart
      - name: 下载 OpenList macOS 内核
        run: python3 .github/scripts/fetch_openlist_core.py macos-universal
      - name: 检查 rust-toolchain.toml
        run: rustup show
      - name: 构建 Flutter macOS 应用
        run: flutter build macos --release --no-pub
      - name: 校验 macOS 包含 OpenList 内核
        run: |
          test -s build/macos/Build/Products/Release/VeneraPlus.app/Contents/Frameworks/libvenera_openlist.dylib
      - name: 创建 DMG
        run: |
          mkdir -p dist
          mkdir -p dist/dmg_contents
          cp -R build/macos/Build/Products/Release/VeneraPlus.app dist/dmg_contents/
          ln -s /Applications dist/dmg_contents/Applications
          hdiutil create -volname "VeneraPlus" -srcfolder dist/dmg_contents -ov -format UDZO "dist/VeneraPlus.dmg"
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv dist/VeneraPlus.dmg "result/VeneraPlus-$APP_VERSION.dmg"
      - name: sccache 统计
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: 上传 DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos_build
          path: result/
          if-no-files-found: error
          retention-days: 7

  Build_IOS:
    if: ${{ inputs.build_ios }}
    runs-on: macos-15
    timeout-minutes: ${{ inputs.release_mode && 360 || 45 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: "stable"
          flutter-version-file: pubspec.yaml
          architecture: arm64
          cache: true
      - name: 配置 sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: sudo xcode-select --switch /Applications/Xcode_16.4.app
      - name: 准备 Rust 工具链
        run: |
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-apple-darwin \
            --target x86_64-apple-darwin \
            --target aarch64-apple-ios
      - name: 串行化 Rustup 安装操作
        run: |
          install "$(command -v rustup)" "$RUNNER_TEMP/rustup"
          mkdir -p "$HOME/.cargo/bin"
          rm -f "$HOME/.cargo/bin/rustup"
          install .github/scripts/serialized_rustup.py "$HOME/.cargo/bin/rustup"
          chmod +x "$HOME/.cargo/bin/rustup"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "RUSTUP_REAL_BINARY=$RUNNER_TEMP/rustup" >> "$GITHUB_ENV"
          echo "RUSTUP_LOCK_FILE=$RUNNER_TEMP/venera-plus-rustup.lock" >> "$GITHUB_ENV"
      - run: flutter pub get --enforce-lockfile
      - name: 配置 rhttp 签名预编译库
        run: dart tool/prepare_rhttp_prebuilt.dart
      - name: 下载 OpenList iOS 内核
        run: python3 .github/scripts/fetch_openlist_core.py ios
      - name: 构建 iOS 应用
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          IOS_VERSION="${APP_VERSION%%+*}"
          IOS_BUILD="${APP_VERSION#*+}"
          if [ "$IOS_BUILD" = "$APP_VERSION" ]; then
            IOS_BUILD=1
          fi
          IOS_VERSION="${IOS_VERSION%%-*}"
          echo "正在根据 ${APP_VERSION} 构建 iOS 包版本 ${IOS_VERSION}+${IOS_BUILD}"
          flutter build ios \
            --no-pub \
            --release \
            --no-codesign \
            --build-name="$IOS_VERSION" \
            --build-number="$IOS_BUILD"
      - name: 校验 iOS 包含 OpenList 内核
        run: |
          # 静态框架由 AppDelegate 的 OpenlistcoreInvoke 强引用链接进 Runner。
          test -s ios/Frameworks/Openlistcore.xcframework/ios-arm64/Openlistcore.framework/Openlistcore
          test -s build/ios/iphoneos/Runner.app/Runner
      - name: 打包 IPA
        run: |
          mkdir -p build/ios/iphoneos/Payload
          mv build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos/
          zip -r VeneraPlus-ios.ipa Payload
      - name: 将版本号写入文件名
        run: |
          APP_VERSION=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '\r\n')
          mkdir -p result
          mv build/ios/iphoneos/VeneraPlus-ios.ipa "result/VeneraPlus-ios-$APP_VERSION.ipa"
      - name: sccache 统计
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: 上传 iOS Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios_build
          path: result/*.ipa
          if-no-files-found: error
          retention-days: ${{ !inputs.release_mode && 7 || 0 }}

  Upload_IOS:
    runs-on: ubuntu-22.04
    needs: Build_IOS
    if: inputs.release_mode && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载 iOS 构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios_build
          path: outputs
      - name: 上传 IPA 到 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(outputs/*.ipa)
          (( ${#files[@]} == 1 )) || { echo "应当恰好有一个 iOS IPA，实际 ${#files[@]} 个。" >&2; exit 1; }
          existing=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          name=$(basename "${files[0]}")
          if grep -Fxq "$name" <<<"$existing"; then
            echo "Release 已存在 $name，为避免覆盖已发布二进制，本次跳过。"
          else
            gh release upload "${GITHUB_REF_NAME}" "${files[0]}"
          fi

  Build_Linux_x64:
    if: ${{ inputs.build_linux_x64 }}
    runs-on: ubuntu-22.04
    timeout-minutes: ${{ inputs.release_mode && 360 || 30 }}
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
      CARGO_INCREMENTAL: "0"
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 配置 sccache
        id: sccache
        uses: Mozilla-Actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
      - name: 缓存 Cargo 依赖
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}-${{ hashFiles('rust-toolchain.toml') }}
          restore-keys: |
            cargo-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - name: 准备 Rust 工具链
        run: python3 .github/scripts/prepare_rust_toolchain.py
      - name: 安装 Linux 构建依赖
        run: |
          flutter pub get --enforce-lockfile
          dart tool/prepare_rhttp_prebuilt.dart
          python3 .github/scripts/fetch_openlist_core.py linux-x64
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev webkit2gtk-4.1
      - name: 构建 Debian x64 软件包
        run: python3 debian/build.py x64
      - name: 构建 Arch 软件包
        run: python3 .github/scripts/build_arch_package.py
      - name: 清理 Arch 临时文件
        run: |
          sudo rm -rf build/linux/arch/app.tar.gz
          sudo rm -rf build/linux/arch/pkg
          sudo rm -rf build/linux/arch/src
          sudo rm -rf build/linux/arch/PKGBUILD
          sudo rm -rf build/linux/arch/Dockerfile
          rm -f build/linux/arch/venera-plus-debug-*.pkg.tar.zst
      - name: 校验 Linux x64 构建产物
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(build/linux/x64/release/debian/*.deb)
          arch_assets=(build/linux/arch/*.zst build/linux/arch/*.AppImage)
          (( ${#debs[@]} > 0 )) || { echo "没有找到 Linux x64 DEB。" >&2; exit 1; }
          (( ${#arch_assets[@]} > 0 )) || { echo "没有找到 Arch/AppImage 构建产物。" >&2; exit 1; }
          for file in "${debs[@]}" "${arch_assets[@]}"; do
            [[ -s "$file" ]] || { echo "构建产物为空：$file" >&2; exit 1; }
          done
          for deb in "${debs[@]}"; do
            dpkg-deb -c "$deb" | grep 'libvenera_openlist\.so$' > /dev/null || { echo "DEB 未包含 OpenList 内核：$deb" >&2; exit 1; }
          done
      - name: sccache 统计
        if: ${{ always() && steps.sccache.outcome == 'success' }}
        run: sccache --show-stats
      - name: 上传 Debian x64 Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deb_build
          path: build/linux/x64/release/debian/*.deb
          if-no-files-found: error
          retention-days: ${{ !inputs.release_mode && 7 || 0 }}
      - name: 上传 Arch Workflow Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch_build
          path: |
            build/linux/arch/*.zst
            build/linux/arch/*.AppImage
          if-no-files-found: error
          retention-days: ${{ !inputs.release_mode && 7 || 0 }}

  Upload_Linux:
    runs-on: ubuntu-22.04
    needs: Build_Linux_x64
    if: inputs.release_mode && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: 下载 Debian x64 构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deb_build
          path: outputs/deb
      - name: 下载 Arch 构建产物
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: arch_build
          path: outputs/arch
      - name: 上传 Linux x64 构建产物到 Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(outputs/deb/*.deb)
          arch_assets=(outputs/arch/*.zst outputs/arch/*.AppImage)
          (( ${#debs[@]} > 0 )) || { echo "下载后没有找到 Linux x64 DEB。" >&2; exit 1; }
          (( ${#arch_assets[@]} > 0 )) || { echo "下载后没有找到 Arch/AppImage。" >&2; exit 1; }
          files=("${debs[@]}" "${arch_assets[@]}")
          existing=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          for file in "${files[@]}"; do
            name=$(basename "$file")
            if grep -Fxq "$name" <<<"$existing"; then
              echo "Release 已存在 $name，为避免覆盖已发布二进制，本次跳过。"
            else
              gh release upload "${GITHUB_REF_NAME}" "$file"
            fi
          done

  Build_Linux_ARM64:
    if: ${{ inputs.build_linux_arm64 }}
    runs-on: ubuntu-22.04-arm
    timeout-minutes: ${{ inputs.release_mode && 360 || 30 }}
    env:
