name: PR 平台冒烟构建
run-name: "PR 平台冒烟构建 #${{ github.event.pull_request.number }}"

on:
  pull_request:

concurrency:
  group: pr-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: 检测平台构建变更
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      platform: ${{ steps.changed.outputs.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
      - name: 判断是否需要平台构建
        id: changed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          changed_files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" --)"
          printf '%s\n' "$changed_files"
          if printf '%s\n' "$changed_files" | grep -Eq \
            '^(test/integration/|test/driver/|test/features/sync/legacy_sync_reader_test\.dart$|test/features/sync/source_identity_recovery_test\.dart$|lib/|assets/|android/|windows/|ios/|macos/|linux/|debian/|patch/|\.github/workflows/|\.github/scripts/|pubspec\.yaml$|pubspec\.lock$|rust-toolchain\.toml$|analysis_options\.yaml$)'; then
            echo "platform=true" >> "$GITHUB_OUTPUT"
          else
            echo "platform=false" >> "$GITHUB_OUTPUT"
          fi

  android:
    name: Android 冒烟构建与原生验证
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - name: 清理运行器空间以确保原生执行可靠
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
      - name: 配置 KVM 权限
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-udev.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - name: 准备 Rust 工具链
        run: |
          # Cargokit Debug 会追加 x86/x64，且插件分别使用 1.85.1 (rhttp) 与 stable (irondash/super_native)；
          # 须在 Gradle 并行任务前串行预装全部 3 目标，避免并发执行 rustup target add 产生冲突。
          python3 .github/scripts/prepare_rust_toolchain.py \
            --target aarch64-linux-android \
            --target i686-linux-android \
            --target x86_64-linux-android
          rustup target add --toolchain stable \
            aarch64-linux-android \
            i686-linux-android \
            x86_64-linux-android
          rustup run stable cargo --version
          rustup target list --toolchain stable --installed
      - uses: actions/setup-java@v6
        with:
          distribution: oracle
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - name: 准备临时 Android Debug 签名
        run: |
          keytool -genkeypair -noprompt \
            -keystore android/debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000
          printf '%s\n' \
            'storePassword=android' \
            'keyPassword=android' \
            'keyAlias=androiddebugkey' \
            'storeFile=../debug.keystore' \
            > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Android Debug APK (arm64)
        run: flutter build apk --debug --target-platform android-arm64
      - name: 运行 Android 平台冒烟与数据库原生验证
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            flutter drive --driver=test/driver/platform_smoke_driver.dart --target=test/integration/platform_smoke.dart -d emulator-5554 --dart-define=CI_NATIVE_SMOKE=true
            test -s build/smoke-artifacts/android_smoke.png
      - name: 上传 Android 冒烟产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-smoke-artifacts
          path: build/smoke-artifacts
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 冒烟构建与原生验证
    needs: changes
    if: ${{ needs.changes.outputs.platform == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          architecture: x64
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: 构建 Windows Debug 应用
        run: flutter build windows --debug
      - name: 执行 QuickJS 源迁移与标识恢复原生测试
        shell: pwsh
        run: |
          $runnerDir = Join-Path (Get-Location) 'build\windows\x64\runner\Debug'
          $pluginDll = Join-Path $runnerDir 'flutter_qjs_plugin.dll'
          if (-not (Test-Path $pluginDll)) {
              throw "未找到 QuickJS 原生插件库：$pluginDll"
          }
          $flutterDll = Join-Path $runnerDir 'flutter_windows.dll'
          if (-not (Test-Path $flutterDll)) {
              throw "未找到 Flutter 原生引擎库：$flutterDll"
          }
          $env:PATH = "$runnerDir;$env:PATH"
          flutter test --no-pub --reporter=expanded --dart-define=CI_REQUIRE_QUICKJS=true --name 'LegacySyncReader QuickJS Source Migration|SourceIdentityRecovery QuickJS' test/features/sync/legacy_sync_reader_test.dart test/features/sync/source_identity_recovery_test.dart
          if ($LASTEXITCODE -ne 0) {
              throw "QuickJS 源迁移与标识恢复原生测试执行失败，退出码：$LASTEXITCODE"
          }
      - name: 执行 Windows 真实启动脚本验证
        shell: pwsh
        run: |
          .\.github\scripts\test_windows_startup.ps1 -Application build\windows\x64\runner\Debug\VeneraPlus.exe -OutputDirectory build\windows\startup-smoke
      - name: 执行 Windows 原生数据库与应用场景集成测试
        shell: pwsh
        run: |
          $smokeDir = (Join-Path (Get-Location) 'build\smoke-artifacts')
          New-Item -ItemType Directory -Path $smokeDir -Force | Out-Null
          flutter drive --driver=test/driver/platform_smoke_driver.dart --target=test/integration/platform_smoke.dart -d windows "--dart-define=CI_NATIVE_SMOKE=true" "--dart-define=SMOKE_ARTIFACT_DIR=$smokeDir" --timeout 900
          $screenshot = Join-Path $smokeDir 'smoke_rendered_frame.png'
          if (-not (Test-Path $screenshot) -or (Get-Item $screenshot).Length -eq 0) {
              throw "Windows smoke screenshot was not generated or is empty: $screenshot"
          }
      - name: 上传 Windows 冒烟产物
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke-artifacts
          path: |
            build/smoke-artifacts
            build/windows/startup-smoke
          if-no-files-found: error
          retention-days: 7

  platform_gate:
    name: 平台冒烟构建门禁
    needs: [changes, android, windows]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 汇总平台构建结果
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" || \
                ("$ANDROID_RESULT" != "success" && "$ANDROID_RESULT" != "skipped") || \
                ("$WINDOWS_RESULT" != "success" && "$WINDOWS_RESULT" != "skipped") ]]; then
            echo "平台冒烟构建未通过：changes=$CHANGES_RESULT android=$ANDROID_RESULT windows=$WINDOWS_RESULT"
            exit 1
          fi
          echo "平台冒烟构建通过：Android=$ANDROID_RESULT Windows=$WINDOWS_RESULT"
